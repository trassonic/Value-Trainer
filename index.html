<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Value Trainer</title>
<style>
*{
  box-sizing:border-box;
}
body{
  margin:0;
  background:#181818;
  color:#eee;
  font-family:Arial,sans-serif;
}
main{
  max-width:600px;
  margin:auto;
  padding:18px 14px 30px;
}
h1{
  text-align:center;
  margin:5px 0;
  letter-spacing:1px;
}
.sub{
  text-align:center;
  color:#aaa;
  margin-bottom:15px;
}
.bar{
  background:#282828;
  border-radius:14px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:14px;
}
.tabs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
  margin-bottom:10px;
}
button{
  font:inherit;
  border:0;
  border-radius:10px;
  padding:12px;
  background:#383838;
  color:#eee;
  cursor:pointer;
}
button:active{
  transform:scale(.98);
}
.tabs button.active{
  background:#eee;
  color:#111;
}
.card{
  background:#282828;
  border-radius:14px;
  padding:14px;
}
.q{
  text-align:center;
  font-weight:bold;
  margin:5px 0 15px;
}
.pair{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.swatch{
  height:220px;
  padding:0;
  border:3px solid transparent;
}
.swatch:active{
  border-color:white;
}
.color{
  height:200px;
  border-radius:12px;
  margin-bottom:12px;
}
.answers{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.answers button{
  font-size:18px;
}
.big{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin:8px;
}
input[type="range"]{
  width:100%;
  accent-color:white;
}
.step-control{
  text-align:center;
  margin-top:12px;
  color:#aaa;
}
select{
  background:#383838;
  color:#eee;
  border:0;
  border-radius:8px;
  padding:7px 10px;
  margin-left:5px;
}
.check{
  width:100%;
  margin-top:12px;
  background:#eee;
  color:#111;
  font-weight:bold;
}
.feedback{
  text-align:center;
  min-height:30px;
  padding-top:10px;
  font-weight:bold;
}
.next{
  width:100%;
  background:#eee;
  color:#111;
  font-weight:bold;
  margin-top:5px;
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}
.stat{
  background:#282828;
  border-radius:14px;
  padding:14px;
  text-align:center;
  color:#aaa;
}
.stat b{
  display:block;
  color:#fff;
  font-size:20px;
  margin-top:3px;
}
.hide{
  display:none;
}
.target-label{
  text-align:center;
  color:#aaa;
  font-size:13px;
  margin-bottom:6px;
}
</style>
</head>
<body>
<main>
<h1>VALUE TRAINER</h1>
<div class="sub">
Train your eye to see light and dark.
</div>
<div class="bar">
<b>
Score: <span id="score">0</span>
</b>
<span>
Streak: <span id="streak">0</span>
</span>
<span>
Round: <span id="round">1</span>
</span>
</div>
<div class="tabs">
<button class="active" id="tabCompare">
Compare
</button>
<button id="tabGuess">
Guess Value
</button>
<button id="tabMatch">
Match Value
</button>
</div>
<div class="card">
<!-- =========================
     COMPARE
========================= -->
<section id="compare">
<div class="q">
Which color is DARKER?
</div>
<div class="pair">
</div>
</section>
<!-- =========================
     GUESS VALUE
========================= -->
<section
  id="guess"
  class="hide">
<div class="q">
What is the Value?
<br>
<span style="color:#aaa;font-size:13px">
1 = black · 9 = white
</span>
</div>
<div
  class="color"
  id="guessColor">
</div>
<div
  class="answers"
  id="answers">
</div>
</section>
<!-- =========================
     MATCH VALUE
========================= -->
<section
  id="match"
  class="hide">
<div class="q">
Match the Value
</div>
<div class="target-label">
TARGET
</div>
<div
  class="color"
  id="targetColor">
</div>
<div style="
text-align:center;
font-size:14px;
color:#aaa;
margin:10px 0 6px;
">
Your Value
</div>
<div
  class="color"
  id="yourColor">
</div>
<div class="big">
<span id="sliderValue">5.0</span>
</div>

<input
id=“slider”
type=“range”
min=“1”
max=“9”
step=“0.1”
value=“5”

<div class="step-control">

Step:

<select id="stepSize">
<option value="0.1">
0.1
</option>
<option value="0.5">
0.5
</option>
<option value="1">
1.0
</option>
</select>
</div>

CHECK
</section>
<div
  class="feedback"
  id="feedback">
</div>

NEXT ROUND
</div>
<div class="stats">
<div class="stat">
Accuracy
<b id="accuracy">—</b>
</div>
<div class="stat">
Average error
<b id="error">—</b>
</div>
</div>
</main>
<script>
/* ==================================================
   GAME VARIABLES
================================================== */
let mode = "compare";
let score = 0;
let streak = 0;
let round = 1;
let attempts = 0;
let correct = 0;
let errorSum = 0;
let answered = false;
/* ==================================================
   HELPERS
================================================== */
function get(id){
  return document.getElementById(id);
}
function random(min,max){
  return min + Math.random() * (max-min);
}
/* ==================================================
   COLOR SYSTEM
================================================== */
/*
   Value:
   1 = very dark
   9 = very light
   We use HSL because it is extremely
   well supported by Safari and iPhone.
   Hue = color
   Saturation = intensity
   Lightness = perceived brightness
*/
function color(value,hue,saturation){
  /*
     Convert Value 1–9
     into Lightness 5–95%.
  */
  let lightness =
    5 + ((value-1)/8)*90;
  return (
    "hsl(" +
    hue +
    ", " +
    saturation +
    "%, " +
    lightness +
    "%)"
  );
}
/* ==================================================
   FEEDBACK / SCORE
================================================== */
function finish(
  isCorrect,
  message,
  error
){
  if(answered){
    return;
  }
  answered = true;
  attempts++;
  if(isCorrect){
    correct++;
    streak++;
    score += 10 + streak;
  }else{
    streak = 0;
    score =
      Math.max(
        0,
        score-2
      );
  }
  errorSum += error || 0;
  get("score").textContent =
    score;
  get("streak").textContent =
    streak;
  get("accuracy").textContent =
    Math.round(
      correct/attempts*100
    ) + "%";
  get("error").textContent =
    (
      errorSum/attempts
    ).toFixed(2);
  get("feedback").textContent =
    message;
  get("next")
    .classList
    .remove("hide");
}
/* ==================================================
   NEW ROUND
================================================== */
function newRound(){
  answered = false;
  get("feedback").textContent =
    "";
  get("next")
    .classList
    .add("hide");
  get("round").textContent =
    round;
  /* =================================================
     COMPARE
  ================================================= */
  if(mode === "compare"){
    /*
       Difference gets smaller
       as rounds increase.
    */
    let base =
      random(2,8);
    let difference =
      Math.max(
        0.15,
        0.9 - round*0.015
      );
    let dark =
      base;
    let light =
      Math.min(
        8.8,
        base+difference
      );
    let aIsDark =
      Math.random()<0.5;
    let valueA =
      aIsDark
      ? dark
      : light;
    let valueB =
      aIsDark
      ? light
      : dark;
    /*
       Different colors.
    */
    let hueA =
      Math.round(
        random(0,360)
      );
    let hueB =
      Math.round(
        random(0,360)
      );
    let satA =
      Math.round(
        random(25,85)
      );
    let satB =
      Math.round(
        random(25,85)
      );
    get("compareA").style.background =
      color(
        valueA,
        hueA,
        satA
      );
    get("compareB").style.background =
      color(
        valueB,
        hueB,
        satB
      );
    get("compareA").onclick =
      function(){
        let right =
          valueA < valueB;
        finish(
          right,
          right
            ? "Correct!"
            : "Incorrect!",
          0
        );
      };
    get("compareB").onclick =
      function(){
        let right =
          valueB < valueA;
        finish(
          right,
          right
            ? "Correct!"
            : "Incorrect!",
          0
        );
      };
  }
  /* =================================================
     GUESS VALUE
  ================================================= */
  if(mode === "guess"){
    /*
       Values in 0.5 steps.
    */
    let value =
      Math.round(
        random(1,9)*2
      )/2;
    let hue =
      Math.round(
        random(0,360)
      );
    let saturation =
      Math.round(
        random(25,85)
      );
    get("guessColor").style.background =
      color(
        value,
        hue,
        saturation
      );
    /*
       Create six possible answers.
    */
    let choices =
      new Set();
    choices.add(value);
    while(
      choices.size < 6
    ){
      let choice =
        Math.round(
          random(
            Math.max(
              1,
              value-2
            ),
            Math.min(
              9,
              value+2
            )
          )*2
        )/2;
      choices.add(choice);
    }
    get("answers").innerHTML =
      "";
    let array =
      Array.from(choices);
    array.sort(
      function(){
        return Math.random()-0.5;
      }
    );
    array.forEach(
      function(v){
        let button =
          document.createElement(
            "button"
          );
        button.textContent =
          v.toFixed(1);
        button.onclick =
          function(){
            let error =
              Math.abs(
                v-value
              );
            let right =
              error < 0.26;
            finish(
              right,
              right
                ? "Correct!"
                : "Incorrect — target was " +
                  value.toFixed(1),
              error
            );
          };
        get("answers")
          .appendChild(button);
      }
    );
  }
  /* =================================================
     MATCH VALUE
  ================================================= */
  if(mode === "match"){
    let step =
      Number(
        get("stepSize").value
      );
    let target;
    /*
       Generate target according
       to selected step.
    */
    if(step === 0.1){
      target =
        Math.round(
          random(1.5,8.5)*10
        )/10;
    }
    if(step === 0.5){
      target =
        Math.round(
          random(1.5,8.5)*2
        )/2;
    }
    if(step === 1){
      target =
        Math.round(
          random(2,8)
        );
    }
    /*
       Store target on element.
    */
    get("targetColor").dataset.value =
      target;
    /*
       Same hue and saturation
       for both target and slider.
    */
    let hue =
      Math.round(
        random(0,360)
      );
    let saturation =
      Math.round(
        random(30,75)
      );
    /*
       Save these values so the
       slider can use exactly
       the same color.
    */
    get("yourColor").dataset.hue =
      hue;
    get("yourColor").dataset.saturation =
      saturation;
    /*
       Display target.
    */
    get("targetColor").style.background =
      color(
        target,
        hue,
        saturation
      );
    /*
       Start player's color
       at Value 5.
    */
    get("slider").step =
      step;
    get("slider").value =
      5;
    get("sliderValue").textContent =
      "5.0";
    get("yourColor").style.background =
      color(
        5,
        hue,
        saturation
      );
  }
}
/* ==================================================
   TAB: COMPARE
================================================== */
get("tabCompare").onclick =
  function(){
    mode = "compare";
    get("tabCompare")
      .classList
      .add("active");
    get("tabGuess")
      .classList
      .remove("active");
    get("tabMatch")
      .classList
      .remove("active");
    get("compare")
      .classList
      .remove("hide");
    get("guess")
      .classList
      .add("hide");
    get("match")
      .classList
      .add("hide");
    newRound();
  };
/* ==================================================
   TAB: GUESS
================================================== */
get("tabGuess").onclick =
  function(){
    mode = "guess";
    get("tabCompare")
      .classList
      .remove("active");
    get("tabGuess")
      .classList
      .add("active");
    get("tabMatch")
      .classList
      .remove("active");
    get("compare")
      .classList
      .add("hide");
    get("guess")
      .classList
      .remove("hide");
    get("match")
      .classList
      .add("hide");
    newRound();
  };
/* ==================================================
   TAB: MATCH
================================================== */
get("tabMatch").onclick =
  function(){
    mode = "match";
    get("tabCompare")
      .classList
      .remove("active");
    get("tabGuess")
      .classList
      .remove("active");
    get("tabMatch")
      .classList
      .add("active");
    get("compare")
      .classList
      .add("hide");
    get("guess")
      .classList
      .add("hide");
    get("match")
      .classList
      .remove("hide");
    newRound();
  };
/* ==================================================
   SLIDER
================================================== */
get("slider").oninput =
  function(){
    let value =
      Number(
        this.value
      );
    get("sliderValue").textContent =
      value.toFixed(1);
    let hue =
      Number(
        get("yourColor").dataset.hue
      );
    let saturation =
      Number(
        get("yourColor")
          .dataset
          .saturation
      );
    /*
       IMPORTANT:
       The slider changes ONLY
       the Value / Lightness.
       Hue and saturation remain
       exactly the same.
    */
    get("yourColor").style.background =
      color(
        value,
        hue,
        saturation
      );
  };
/* ==================================================
   STEP SIZE
================================================== */
get("stepSize").onchange =
  function(){
    newRound();
  };
/* ==================================================
   CHECK MATCH
================================================== */
get("check").onclick =
  function(){
    let target =
      Number(
        get("targetColor")
          .dataset
          .value
      );
    let guess =
      Number(
        get("slider").value
      );
    let error =
      Math.abs(
        target-guess
      );
    let right =
      error <= 0.2;
    finish(
      right,
      right
        ? "Correct!"
        : "Incorrect — target was " +
          target.toFixed(1) +
          " · error " +
          error.toFixed(1),
      error
    );
  };
/* ==================================================
   NEXT ROUND
================================================== */
get("next").onclick =
  function(){
    round++;
    newRound();
  };
/* ==================================================
   START GAME
================================================== */
newRound();
</script>
</body>
</html>

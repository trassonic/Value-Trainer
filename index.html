<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Value Trainer Test</title>
<style>
body{
  margin:0;
  background:#181818;
  color:white;
  font-family:Arial,sans-serif;
}
main{
  max-width:600px;
  margin:auto;
  padding:20px;
}
h1{
  text-align:center;
}
p{
  text-align:center;
  color:#aaa;
}
.pair{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:25px;
}
.color{
  height:250px;
  border-radius:15px;
  border:3px solid transparent;
}
button{
  border:0;
  border-radius:12px;
  padding:15px;
  background:#333;
  color:white;
  font-size:18px;
  margin-top:20px;
  width:100%;
}
#result{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  min-height:30px;
  margin-top:20px;
}
</style>
</head>
<body>
<main>
<h1>VALUE TRAINER</h1>
<p>
Welche Farbe ist dunkler?
</p>
<div class="pair">
<button id="left">
  <div class="color" id="colorA"></div>
  A
</button>
<button id="right">
  <div class="color" id="colorB"></div>
  B
</button>
</div>
<div id="result"></div>
<button id="new">
Neue Runde
</button>
</main>
<script>
let darker;
function newRound(){
  /*
    Zwei deutlich unterschiedliche
    Helligkeiten.
  */
  const valueA =
    Math.random() < 0.5 ? 3 : 7;
  const valueB =
    valueA === 3 ? 7 : 3;
  darker =
    valueA < valueB
    ? "A"
    : "B";
  /*
    Unterschiedliche Farbtöne,
    aber eindeutig unterschiedliche Values.
  */
  const hueA =
    Math.floor(Math.random()*360);
  const hueB =
    Math.floor(Math.random()*360);
  const colorA =
    "hsl("+
    hueA+
    ", 70%, "+
    (valueA/9*90)+
    "%)";
  const colorB =
    "hsl("+
    hueB+
    ", 70%, "+
    (valueB/9*90)+
    "%)";
  document.getElementById("colorA")
    .style.backgroundColor =
    colorA;
  document.getElementById("colorB")
    .style.backgroundColor =
    colorB;
  document.getElementById("result")
    .textContent = "";
}
document.getElementById("left")
  .onclick = function(){
    document.getElementById("result")
      .textContent =
      darker === "A"
      ? "CORRECT!"
      : "INCORRECT!";
  };
document.getElementById("right")
  .onclick = function(){
    document.getElementById("result")
      .textContent =
      darker === "B"
      ? "CORRECT!"
      : "INCORRECT!";
  };
document.getElementById("new")
  .onclick = newRound;
newRound();
</script>
</body>
</html>

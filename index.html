<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Value Trainer</title>
<style>
body{
  margin:0;
  background:#181818;
  color:#eee;
  font-family:Arial,sans-serif;
}
main{
  max-width:600px;
  margin:auto;
  padding:18px 14px;
}
h1{
  text-align:center;
  margin:5px 0;
}
.sub{
  text-align:center;
  color:#aaa;
  margin-bottom:15px;
}
.bar,.card,.stat{
  background:#282828;
  border-radius:14px;
  padding:14px;
}
.bar{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  margin-bottom:10px;
}
.tabs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
  margin-bottom:10px;
}
button{
  font:inherit;
  border:0;
  border-radius:10px;
  padding:12px;
  background:#383838;
  color:#eee;
  cursor:pointer;
}
button:active{
  transform:scale(.98);
}
.tabs .active,
.next{
  background:#eee;
  color:#111;
}
.q{
  text-align:center;
  font-weight:bold;
  margin:5px 0 15px;
}
.pair{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.swatch{
  height:220px;
  border:3px solid transparent;
  padding:0;
}
.swatch:active{
  border-color:white;
}
.color{
  height:200px;
  border-radius:12px;
  margin-bottom:12px;
}
.answers{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.answers button{
  font-size:18px;
}
input{
  width:100%;
  accent-color:white;
}
.big{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin:8px;
}
.next{
  width:100%;
  font-weight:bold;
  margin-top:10px;
}
.feedback{
  text-align:center;
  min-height:28px;
  padding-top:10px;
  font-weight:bold;
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}
.stat{
  text-align:center;
  color:#aaa;
}
.stat b{
  display:block;
  color:#fff;
  font-size:20px;
}
.hide{
  display:none;
}
.step-control{
  text-align:center;
  margin-top:12px;
  color:#aaa;
}
.step-control select{
  background:#383838;
  color:#eee;
  border:0;
  border-radius:8px;
  padding:7px 10px;
  margin-left:5px;
}
</style>
</head>
<body>
<main>
<h1>VALUE TRAINER</h1>
<div class="sub">
Train your eye to see light and dark.
</div>
<div class="bar">
  <b>Score: <span id="score">0</span></b>
  <span>Streak: <span id="streak">0</span></span>
  <span>Round: <span id="round">1</span></span>
</div>
<div class="tabs">
<button class="active" data-mode="compare">
Compare
</button>
<button data-mode="guess">
Guess Value
</button>
<button data-mode="match">
Match Value
</button>
</div>
<div class="card">
<!-- COMPARE -->
<section id="compare">
<div class="q">
Which color is DARKER?
</div>
<div class="pair">
</div>
</section>
<!-- GUESS VALUE -->
<section id="guess" class="hide">
<div class="q">
What is the Value? 1 = black, 9 = white
</div>
<div class="color" id="gc"></div>
<div class="answers" id="answers"></div>
</section>
<!-- MATCH VALUE -->
<section id="match" class="hide">
<div class="q">
Target Value:
<span id="target">5.0</span>
<br>
Set the slider to match it.
</div>
<div class="color" id="mc"></div>
<div class="big" id="sliderValue">
5.0
</div>

<input
id=“slider”
type=“range”
min=“1”
max=“9”
step=“0.1”
value=“5”

<div class="step-control">

Step:

<select id="stepSize">
<option value="0.1">0.1</option>
<option value="0.5">0.5</option>
<option value="1">1.0</option>
</select>
</div>
<button class="next" id="check">
CHECK
</button>
</section>
<div class="feedback" id="feedback"></div>
<button class="next hide" id="next">
NEXT ROUND
</button>
</div>
<div class="stats">
<div class="stat">
Accuracy
<b id="accuracy">—</b>
</div>
<div class="stat">
Average error
<b id="error">—</b>
</div>
</div>
</main>
<script>
let mode = "compare";
let score = 0;
let streak = 0;
let round = 1;
let attempts = 0;
let correct = 0;
let errorSum = 0;
let answered = false;
/* Easy ID shortcut */
function $(id){
  return document.getElementById(id);
}
/* Random number */
function random(min,max){
  return min + Math.random() * (max-min);
}
/* ==================================================
   COLOR
================================================== */
/*
   Value 1 = very dark
   Value 9 = very light
   Hue and chroma are kept separate from Value.
*/
function makeColor(value,hue,chroma){
  const lightness =
    0.06 + ((value-1)/8)*0.88;
  /*
     Use CSS OKLCH.
     The fallback makes sure there is still
     a visible color if OKLCH is unsupported.
  */
  const oklch =
    "oklch(" +
    lightness + " " +
    chroma + " " +
    hue +
    ")";
  const fallback =
    "hsl(" +
    hue + " " +
    Math.round(chroma*500) + "% " +
    Math.round(lightness*100) +
    "%)";
  return {
    oklch:oklch,
    fallback:fallback
  };
}
/* Apply color safely */
function setColor(element,value,hue,chroma){
  const color =
    makeColor(
      value,
      hue,
      chroma
    );
  element.style.backgroundColor =
    color.fallback;
  /*
     Modern browsers including current
     Safari will use OKLCH.
  */
  if(
    window.CSS &&
    CSS.supports &&
    CSS.supports(
      "color",
      color.oklch
    )
  ){
    element.style.backgroundColor =
      color.oklch;
  }
}
/* ==================================================
   MATCH COLOR
================================================== */
let matchHue = 0;
let matchChroma = 0.08;
function setMatchColor(value){
  setColor(
    $("mc"),
    value,
    matchHue,
    matchChroma
  );
}
/* ==================================================
   FINISH
================================================== */
function finish(
  isCorrect,
  message,
  error
){
  if(answered){
    return;
  }
  answered = true;
  attempts++;
  if(isCorrect){
    correct++;
    streak++;
    score += 10 + streak;
  }else{
    streak = 0;
    score =
      Math.max(
        0,
        score-2
      );
  }
  errorSum += error || 0;
  $("score").textContent =
    score;
  $("streak").textContent =
    streak;
  $("accuracy").textContent =
    Math.round(
      correct/attempts*100
    ) + "%";
  $("error").textContent =
    (errorSum/attempts)
    .toFixed(2);
  $("feedback").textContent =
    message;
  $("next")
    .classList
    .remove("hide");
}
/* ==================================================
   NEW ROUND
================================================== */
function newRound(){
  answered = false;
  $("feedback").textContent = "";
  $("next")
    .classList
    .add("hide");
  $("round").textContent =
    round;
  /* =================================================
     COMPARE
  ================================================= */
  if(mode === "compare"){
    const base =
      random(2,8);
    const difference =
      Math.max(
        0.12,
        0.8 - round*0.015
      );
    const high =
      Math.min(
        8.8,
        base+difference
      );
    const low =
      Math.max(
        1.2,
        base
      );
    const aHigh =
      Math.random() < 0.5;
    const valueA =
      aHigh ? high : low;
    const valueB =
      aHigh ? low : high;
    /* Completely different colors */
    const hueA =
      random(0,360);
    const hueB =
      random(0,360);
    const chromaA =
      random(0.025,0.16);
    const chromaB =
      random(0.025,0.16);
    setColor(
      $("a"),
      valueA,
      hueA,
      chromaA
    );
    setColor(
      $("b"),
      valueB,
      hueB,
      chromaB
    );
    $("a").onclick = function(){
      const right =
        valueA < valueB;
      finish(
        right,
        right
          ? "Correct!"
          : "Incorrect!",
        0
      );
    };
    $("b").onclick = function(){
      const right =
        valueB < valueA;
      finish(
        right,
        right
          ? "Correct!"
          : "Incorrect!",
        0
      );
    };
  }
  /* =================================================
     GUESS VALUE
  ================================================= */
  if(mode === "guess"){
    const value =
      Math.round(
        random(1.5,8.5)*2
      )/2;
    const hue =
      random(0,360);
    const chroma =
      random(0.025,0.16);
    setColor(
      $("gc"),
      value,
      hue,
      chroma
    );
    const choices =
      new Set();
    choices.add(value);
    while(
      choices.size < 6
    ){
      const choice =
        Math.round(
          random(
            Math.max(1,value-2),
            Math.min(9,value+2)
          )*2
        )/2;
      choices.add(choice);
    }
    const shuffled =
      [...choices]
      .sort(
        function(){
          return Math.random()-0.5;
        }
      );
    $("answers").innerHTML =
      "";
    shuffled.forEach(
      function(v){
        const button =
          document.createElement(
            "button"
          );
        button.textContent =
          v.toFixed(1);
        button.onclick =
          function(){
            const error =
              Math.abs(
                v-value
              );
            const right =
              error < 0.26;
            finish(
              right,
              right
                ? "Correct!"
                : "Incorrect — target was " +
                  value.toFixed(1),
              error
            );
          };
        $("answers")
          .appendChild(button);
      }
    );
  }
  /* =================================================
     MATCH VALUE
  ================================================= */
  if(mode === "match"){
    const step =
      Number(
        $("stepSize").value
      );
    /*
       Generate target according to
       selected step size.
    */
    let target;
    if(step === 0.1){
      target =
        Math.round(
          random(1.5,8.5)*10
        )/10;
    }else if(step === 0.5){
      target =
        Math.round(
          random(1.5,8.5)*2
        )/2;
    }else{
      target =
        Math.round(
          random(2,8)
        );
    }
    $("target").textContent =
      target.toFixed(1);
    /*
       One hue/chroma for this round.
       Only Value changes with slider.
    */
    matchHue =
      random(0,360);
    matchChroma =
      random(0.04,0.12);
    /*
       Start slider at 5.
    */
    $("slider").min = 1;
    $("slider").max = 9;
    $("slider").step = step;
    $("slider").value = 5;
    $("sliderValue").textContent =
      "5.0";
    setMatchColor(5);
  }
}
/* ==================================================
   TAB BUTTONS
================================================== */
document
  .querySelectorAll(
    ".tabs button"
  )
  .forEach(
    function(button){
      button.onclick =
        function(){
          mode =
            button.dataset.mode;
          document
            .querySelectorAll(
              ".tabs button"
            )
            .forEach(
              function(b){
                b.classList
                  .remove("active");
              }
            );
          button.classList
            .add("active");
          [
            "compare",
            "guess",
            "match"
          ]
          .forEach(
            function(id){
              $(id)
                .classList
                .add("hide");
            }
          );
          $(mode)
            .classList
            .remove("hide");
          newRound();
        };
    }
  );
/* ==================================================
   SLIDER
================================================== */
$("slider").oninput =
  function(){
    const value =
      Number(
        this.value
      );
    $("sliderValue").textContent =
      value.toFixed(1);
    /*
       IMPORTANT:
       Only Value changes.
       Hue and Chroma stay the same.
    */
    setMatchColor(value);
  };
/* ==================================================
   STEP SIZE
================================================== */
$("stepSize").onchange =
  function(){
    /*
       New target with new step size.
    */
    newRound();
  };
/* ==================================================
   CHECK
================================================== */
$("check").onclick =
  function(){
    const target =
      Number(
        $("target").textContent
      );
    const guess =
      Number(
        $("slider").value
      );
    const error =
      Math.abs(
        target-guess
      );
    const right =
      error <= 0.2;
    finish(
      right,
      right
        ? "Correct!"
        : "Target " +
          target.toFixed(1) +
          " · Error " +
          error.toFixed(1),
      error
    );
  };
/* ==================================================
   NEXT ROUND
================================================== */
$("next").onclick =
  function(){
    round++;
    newRound();
  };
/* ==================================================
   START
================================================== */
newRound();
</script>
</body>
</html>
